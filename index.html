<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Balaji Sugandhalay - Shop Manager POS</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8b1538">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BalajiPOS">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <link rel="stylesheet" href="./style.css">
  
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- QRCode Generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand">
        <img src="./logo.png" alt="Balaji Sugandhalay Logo" class="brand-logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'48\' height=\'48\' viewBox=\'0 0 24 24\'><rect width=\'24\' height=\'24\' fill=\'%238b1538\'/><text x=\'50%\' y=\'55%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23d4a373\' font-size=\'12\' font-weight=\'bold\'>BS</text></svg>';">
        <div class="brand-text">
          <h2>Balaji Sugandhalay</h2>
          <span class="tagline">Shop Manager POS</span>
        </div>
      </div>
      <nav class="nav-menu">
        <button class="nav-btn active" data-view="billing">⚡ Billing / POS</button>
        <button class="nav-btn" data-view="inventory">📦 Inventory & Stock</button>
        <button class="nav-btn" data-view="analytics">📊 Sales & Reports</button>
        <button class="nav-btn" data-view="customers">👥 Udhaar Ledger</button>
        <button class="nav-btn" data-view="backup">💾 Backup & Restore</button>
      </nav>
      <div class="sidebar-bottom">
        <button id="btn-install" class="btn-install" style="display: none;">📲 Install App</button>
        <small class="version-tag">v4.5 • PWA & LocalStorage</small>
      </div>
    </aside>

    <!-- Main View Container -->
    <main class="main-content" id="view-container"></main>
  </div>

  <!-- Camera Scanner Modal -->
  <div id="scanner-modal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>📷 Scan Barcode / QR Code</h3>
        <button class="modal-close" onclick="closeScanner()">×</button>
      </div>
      <div id="reader"></div>
      <p class="scanner-hint">Point your camera at any product barcode or QR code.</p>
      <button class="btn-secondary" style="width:100%; margin-top:15px;" onclick="closeScanner()">Close Scanner</button>
    </div>
  </div>

  <!-- UPI QR Code Modal -->
  <div id="upi-modal" class="modal">
    <div class="modal-card text-center">
      <div class="modal-header">
        <h3>⚡ Customer UPI Payment</h3>
        <button class="modal-close" onclick="closeUpiModal()">×</button>
      </div>
      <div id="upi-qrcode-container" class="upi-box"></div>
      <h2 id="upi-modal-amount" class="upi-amount">₹0.00</h2>
      <p class="text-muted">Scan using Google Pay, PhonePe, Paytm or BHIM</p>
      <button class="btn-primary" style="margin-top:15px;" onclick="confirmUpiPayment()">Payment Received & Print</button>
    </div>
  </div>

  <!-- Thermal Print Template -->
  <div id="print-area"></div>

  <script src="./app.js"></script>
</body>
</html>
